<!DOCTYPE html>
<html>
<head>
    <title>APK Builder Pro</title>
</head>
<body>

<h2>Create Your Android App</h2>

<input type="text" id="name" placeholder="App Name"><br><br>
<input type="text" id="url" placeholder="Website URL"><br><br>

<button onclick="build()">Generate APK</button>

<p id="status"></p>

<a id="downloadLink" href="#" target="_blank" style="display:none;">
    Download Your APK
</a>

<script>
function build() {
    const name = document.getElementById("name").value;
    const url = document.getElementById("url").value;

    document.getElementById("status").innerText = "Building your app...";

    fetch("https://apk-builder-backend.onrender.com/build", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            url: url
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("status").innerText =
            "App ID: " + data.app_id + " (Wait ~1 min)";

        const link = document.getElementById("downloadLink");
        link.href = data.download;
        link.style.display = "block";
    })
    .catch(() => {
        document.getElementById("status").innerText = "Error building APK";
    });
}
</script>

</body>
</html>
