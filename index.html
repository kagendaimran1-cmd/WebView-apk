<!DOCTYPE html>
<html>
<head>
    <title>APK Builder</title>
</head>
<body>

<h2>Create Your App</h2>

<input type="text" id="url" placeholder="Enter your website URL">
<button onclick="build()">Generate APK</button>

<p id="status"></p>
<a id="downloadLink" href="#" target="_blank" style="display:none;">
    Download APK
</a>

<script>
function build() {
    const url = document.getElementById("url").value;

    document.getElementById("status").innerText = "Building APK... please wait";

    fetch("https://apk-builder-backend.onrender.com/build", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ url: url })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("status").innerText = data.message;

        if (data.download) {
            const link = document.getElementById("downloadLink");
            link.href = data.download;
            link.style.display = "block";
        }
    })
    .catch(err => {
        document.getElementById("status").innerText = "Error building APK";
    });
}
</script>

</body>
</html>
