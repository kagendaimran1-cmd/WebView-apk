<!DOCTYPE html>
<html>
<head>
    <title>APK Builder Pro</title>
</head>
<body>

<h2>Create Your Android App</h2>

<input type="text" id="name" placeholder="App Name"><br><br>
<input type="text" id="url" placeholder="Website URL"><br><br>

<button onclick="build()">Generate APK</button>

<p id="status"></p>

<a id="downloadLink" href="#" target="_blank" style="display:none;">
    Download Your APK
</a>
<script>
function build() {
    const url = document.getElementById("url").value;
    const name = document.getElementById("name") ? document.getElementById("name").value : "MyApp";

    if (!url) {
        document.getElementById("status").innerText = "Please enter a URL";
        return;
    }

    document.getElementById("status").innerText = "Building APK...";

    fetch("https://apk-builder-backend.onrender.com/build", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            url: url,
            name: name
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("status").innerText = data.message;

        if (data.download) {
            const link = document.getElementById("downloadLink");
            link.href = data.download;
            link.style.display = "block";
        }
    })
    .catch(err => {
        document.getElementById("status").innerText = "Error connecting to backend";
        console.log(err);
    });
}
</script>

</body>
</html>
